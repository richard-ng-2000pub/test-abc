<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172637">
<meta name="description" content="MURDGRID interactive case solution">
<title>MURDGRID — Solution</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=3">
<script src="app.js?v=3" defer></script>
</head>
<body>
<div class="app" id="app">
  <header class="topbar">
    <div class="brand">MURD<span>GRID</span></div>
    <h1 id="caseTitle">The Last Toast</h1>
    <div class="verdict" aria-label="Case answer">
      <div><small>KILLER</small><strong id="killerName">—</strong></div>
      <div><small>TIME</small><strong id="deathTime">—</strong></div>
    </div>
  </header>
  <main class="viewer" aria-label="Case reconstruction">
    <div class="map-frame" id="mapStage">
      <div id="mapArt" class="map-art" aria-live="off"></div>
    </div>
  </main>
  <footer class="controls">
    <div class="view-select" role="group" aria-label="Choose map view">
      <button id="allMode" type="button" class="active" aria-pressed="true">Everyone</button>
      <button id="trailMode" type="button" aria-pressed="false">Trail</button>
    </div>
    <select id="actorSelect" aria-label="Select person" hidden></select>
    <div class="steps">
      <button id="prevStep" class="step-arrow" type="button" aria-label="Previous step">‹</button>
      <input id="stepRange" aria-label="Choose time" type="range" min="0" max="8" step="1" value="0">
      <button id="nextStep" class="step-arrow" type="button" aria-label="Next step">›</button>
    </div>
    <div class="now" aria-live="polite"><strong id="clockLabel">8:00 PM</strong><span id="stepIndicator">0 / 8</span></div>
  </footer>
</div>
<div class="fatal" id="fatal" hidden><div><strong>Case unavailable</strong><p id="fatalText"></p></div></div>
</body>
</html>
