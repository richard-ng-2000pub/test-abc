<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#172637">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="description" content="MURDGRID — interactive solution viewer">
<title>MURDGRID — Access</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="styles.css?v=4">
<script src="app.js?v=4" defer></script>
</head>
<body>
<section class="access-screen" id="accessScreen" aria-label="Unlock this solution">
  <div class="access-card">
    <div class="lock-brand">MURD<span>GRID</span></div>
    <h1 id="lockCaseLabel">EXAMPLE</h1>
    <form id="accessForm" autocomplete="off">
      <label for="accessCode">ACCESS CODE</label>
      <input id="accessCode" type="text" inputmode="text" spellcheck="false" autocapitalize="characters" autocomplete="off" maxlength="30" placeholder="XXXX-XXXX-XXXX" required aria-describedby="accessMessage">
      <button id="unlockButton" type="submit">UNLOCK SOLUTION</button>
    </form>
    <p id="accessMessage" class="access-message" role="status" aria-live="polite"></p>
  </div>
</section>
<div class="app" id="app" hidden>
  <header class="topbar">
    <div class="brand">MURD<span>GRID</span></div>
    <h1 id="caseTitle">EXAMPLE</h1>
    <div class="verdict" aria-label="Case answer">
      <div><small>KILLER</small><strong id="killerName">—</strong></div>
      <div><small>TIME</small><strong id="deathTime">—</strong></div>
    </div>
  </header>
  <main class="viewer" aria-label="Case reconstruction">
    <div class="map-frame" id="mapStage"><div id="mapArt" class="map-art"></div></div>
  </main>
  <footer class="controls">
    <div class="view-select" role="group" aria-label="Choose map view">
      <button id="allMode" type="button" class="active" aria-pressed="true">Everyone</button>
      <button id="trailMode" type="button" aria-pressed="false">Trail</button>
    </div>
    <select id="actorSelect" aria-label="Select character" hidden></select>
    <div class="steps">
      <button id="prevStep" class="step-arrow" type="button" aria-label="Previous step">‹</button>
      <input id="stepRange" aria-label="Choose time" type="range" min="0" max="8" step="1" value="0">
      <button id="nextStep" class="step-arrow" type="button" aria-label="Next step">›</button>
    </div>
    <div class="now" aria-live="polite"><strong id="clockLabel">—</strong><span id="stepIndicator">0 / 0</span></div>
  </footer>
</div>
<div id="shortcutWarning" class="shortcut-warning" role="alert" hidden>Developer tools are not permitted on this page.</div>
</body>
</html>
